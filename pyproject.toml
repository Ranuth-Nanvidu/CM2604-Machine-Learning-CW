readme = "README.md"
authors = [
    { name = "Ranuth-Nanvidu", email = "ggranuthnanvidu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
